name: Release plugin

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Which version segment to bump
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
          - revision

permissions:
  contents: write          # lets the reusable workflow create the release + push the bump commit

jobs:
  build:
    uses: Youkaimo/MyDalamudPlugins/.github/workflows/build-plugin.yml@master
    with:
      internal_name: AnoMechFork
      solution_name: AnoMech
      version_bump: ${{ inputs.version_bump }}
      csproj_path: AnoMech/AnoMech.csproj
      release_dir: AnoMech/bin/x64/Release/AnoMechFork
    secrets:
      PAT: ${{ secrets.PAT }}
